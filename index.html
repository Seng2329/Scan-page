<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="สแกน">
<meta name="theme-color" content="#111111">
<title>สแกนเอกสาร</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#111;color:#eee;font-family:-apple-system,"Sukhumvit Set",sans-serif;overscroll-behavior:none}
.screen{display:none;position:fixed;inset:0;flex-direction:column}
.screen.on{display:flex}
header{padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:18px;margin:0}
#cvstat{font-size:12px;color:#aaa}
button{font:inherit;color:#fff;background:#2c2c2e;border:0;border-radius:12px;padding:12px 14px}
button.pri{background:#0a84ff}
button.dng{background:#5a2020}
button:disabled{opacity:.4}
#grid{flex:1;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start}
.th{position:relative;aspect-ratio:3/4;background:#222;border-radius:8px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:contain}
.th b{position:absolute;left:6px;bottom:6px;background:#000a;border-radius:10px;padding:1px 8px;font-size:12px}
#empty{grid-column:1/-1;text-align:center;color:#888;padding:60px 20px;line-height:1.7}
.bar{display:flex;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);background:#1a1a1a;flex-wrap:wrap}
.bar button{flex:1;min-width:0}
#cam video{flex:1;width:100%;min-height:0;object-fit:cover;background:#000}
#camBar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px calc(env(safe-area-inset-bottom) + 14px);background:#000}
#shutter{width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid #888;padding:0}
#shutter:active{background:#ccc}
#cnt{min-width:70px;text-align:center}
#editWrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;touch-action:none}
#editCv{touch-action:none;max-width:100%;max-height:100%}
.seg{display:flex;gap:5px;width:100%;flex-wrap:wrap}
.seg button{flex:1;padding:10px 2px;font-size:13px;min-width:0}
.seg button.sel{background:#0a84ff}
#busy{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;font-size:16px;z-index:9}
#busy.on{display:flex}
</style>
</head>
<body>

<section id="home" class="screen on">
  <header><h1>สแกนเอกสาร <span id="pc"></span></h1><span id="cvstat">กำลังโหลดตัวประมวลผลภาพ…</span></header>
  <div id="grid"></div>
  <div class="bar">
    <button id="bCam" class="pri" disabled>📷 ถ่าย</button>
    <button id="bImp" disabled>🖼 จากอัลบั้ม</button>
    <button id="bPdf" disabled>📄 สร้าง PDF</button>
  </div>
  <div class="bar" style="padding-top:0"><button id="bClr" class="dng">ล้างทั้งหมด</button></div>
  <input id="file" type="file" accept="image/*" multiple hidden>
</section>

<section id="cam" class="screen">
  <video id="vid" playsinline muted autoplay></video>
  <div id="camBar">
    <button id="camDone" class="pri">เสร็จ</button>
    <button id="shutter" aria-label="ถ่าย"></button>
    <div id="cnt">0 หน้า</div>
  </div>
</section>

<section id="edit" class="screen">
  <header><h1 id="eTitle">แก้ไขหน้า</h1><button id="eBack">ปิด</button></header>
  <div id="editWrap"><canvas id="editCv"></canvas></div>
  <div class="bar">
    <div class="seg" id="filters">
      <button data-f="color">ต้นฉบับ</button>
      <button data-f="even">ปรับแสง</button>
      <button data-f="scan">สแกนสี</button>
      <button data-f="scangray">สแกนเทา</button>
      <button data-f="bw">ขาวดำ</button>
    </div>
    <button id="eL">⬅ เลื่อน</button>
    <button id="eR">เลื่อน ➡</button>
    <button id="eRot">⟳ หมุน</button>
    <button id="eAuto">ตรวจขอบใหม่</button>
    <button id="eDel" class="dng">🗑 ลบ</button>
    <button id="ePrev">👁 ดูผลลัพธ์</button>
    <button id="eSave" class="pri" style="flex-basis:100%">บันทึกหน้านี้</button>
  </div>
</section>

<div id="busy">กำลังประมวลผล…</div>

<script src="https://docs.opencv.org/4.x/opencv.js" async></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const MAXSIDE=2400;
let pages=[];            // {id, orig:Blob, corners:[[x,y]x4], filter, out:Blob, w, h, url}
let stream=null, shots=0;
let ed=null;             // {idx, canvas, corners, filter, f, drag}

/* ---------- OpenCV ready ---------- */
const cvReady=new Promise(res=>{
  const t=setInterval(()=>{ if(window.cv&&cv.Mat){clearInterval(t);res();} },150);
});
cvReady.then(()=>{
  $('#cvstat').textContent='พร้อมใช้งาน';
  ['bCam','bImp','bPdf'].forEach(i=>$('#'+i).disabled=false);
});

/* ---------- helpers ---------- */
const busy=(on,t)=>{ $('#busy').classList.toggle('on',on); if(t)$('#busy').textContent=t; };
const show=id=>{ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); };
const c2b=(c,q=0.88)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
async function b2c(blob){
  const url=URL.createObjectURL(blob), img=new Image();
  img.src=url; await img.decode();
  const s=Math.min(1,MAXSIDE/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas');
  c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  URL.revokeObjectURL(url); return c;
}
function order(p){
  const s=p.map(a=>a[0]+a[1]), d=p.map(a=>a[0]-a[1]);
  return [p[s.indexOf(Math.min(...s))],p[d.indexOf(Math.max(...d))],p[s.indexOf(Math.max(...s))],p[d.indexOf(Math.min(...d))]];
}

/* ---------- detect paper edges ---------- */
/*DETECT_START*/
function polyArea(q){ let a=0; for(let i=0;i<4;i++){const p=q[i],n=q[(i+1)%4]; a+=p[0]*n[1]-n[0]*p[1];} return Math.abs(a)/2; }

// src: RGBA Mat (already downscaled). Returns [{quad,score}] in src coordinates.
function detectCore(src){
  const W=src.cols,H=src.rows,IA=W*H,del=[],res=[];
  const mk=()=>{const m=new cv.Mat(); del.push(m); return m;};
  const g=mk(),bl=mk();
  cv.cvtColor(src,g,cv.COLOR_RGBA2GRAY);
  cv.GaussianBlur(g,bl,new cv.Size(7,7),0);
  const k5=cv.getStructuringElement(cv.MORPH_RECT,new cv.Size(5,5)); del.push(k5);
  const k11=cv.getStructuringElement(cv.MORPH_RECT,new cv.Size(11,11)); del.push(k11);
  const masks=[];   // {m, open}

  // 1) bright paper vs darker background (Otsu)
  const otsu=mk(); cv.threshold(bl,otsu,0,255,cv.THRESH_BINARY+cv.THRESH_OTSU); masks.push({m:otsu,open:true});

  // 2) low-saturation + bright (white paper on coloured table)
  const rgb=mk(),hsv=mk(),sat=mk(),pm=mk();
  cv.cvtColor(src,rgb,cv.COLOR_RGBA2RGB); cv.cvtColor(rgb,hsv,cv.COLOR_RGB2HSV);
  const ch=new cv.MatVector(); cv.split(hsv,ch);
  const s1=ch.get(1); cv.threshold(s1,sat,0,255,cv.THRESH_BINARY_INV+cv.THRESH_OTSU); s1.delete(); ch.delete();
  cv.bitwise_and(sat,otsu,pm); masks.push({m:pm,open:true});

  // 3) edge maps, two sensitivities
  for(const [lo,hi] of [[30,90],[60,160]]){
    const e=mk(); cv.Canny(bl,e,lo,hi); cv.dilate(e,e,k5); masks.push({m:e,open:false});
  }

  for(const {m:m0,open} of masks){
    const m=mk();
    if(open) cv.morphologyEx(m0,m,cv.MORPH_OPEN,k5); else m0.copyTo(m);
    cv.morphologyEx(m,m,cv.MORPH_CLOSE,k11);
    const cs=new cv.MatVector(),h=mk();
    cv.findContours(m,cs,h,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);
    const list=[]; for(let i=0;i<cs.size();i++) list.push(cs.get(i));
    const ranked=list.map(c=>[cv.contourArea(c),c]).filter(a=>a[0]>IA*0.10).sort((a,b)=>b[0]-a[0]).slice(0,2);
    for(const [,c] of ranked){
      const hull=new cv.Mat(); cv.convexHull(c,hull,false,true);
      const ha=cv.contourArea(hull);
      if(ha>=IA*0.10&&ha<=IA*0.97){
        let quad=null; const peri=cv.arcLength(hull,true);
        for(let e=0.01;e<=0.10;e+=0.005){
          const ap=new cv.Mat(); cv.approxPolyDP(hull,ap,e*peri,true);
          const n=ap.rows;
          if(n===4){ quad=[]; for(let j=0;j<4;j++) quad.push([ap.data32S[j*2],ap.data32S[j*2+1]]); }
          ap.delete();
          if(quad||n<4) break;
        }
        if(!quad){ const r=cv.minAreaRect(hull); quad=cv.RotatedRect.points(r).map(p=>[p.x,p.y]); }
        quad=quad.map(p=>[Math.max(0,Math.min(W-1,p[0])),Math.max(0,Math.min(H-1,p[1]))]);
        const qa=polyArea(quad);
        if(qa>IA*0.08){
          const fit=Math.min(ha,qa)/Math.max(ha,qa);
          let score=ha*fit*fit; if(ha>0.85*IA) score*=0.5;
          res.push({quad,score});
        }
      }
      hull.delete();
    }
    list.forEach(c=>c.delete()); cs.delete();
  }
  del.forEach(m=>m.delete());
  return res;
}

// returns candidate quads (best first), full-size canvas coordinates; last one is a plain margin box
function detectAll(canvas){
  const sc=Math.min(1,600/Math.max(canvas.width,canvas.height));
  const t=document.createElement('canvas');
  t.width=Math.round(canvas.width*sc); t.height=Math.round(canvas.height*sc);
  t.getContext('2d').drawImage(canvas,0,0,t.width,t.height);
  const src=cv.imread(t); let r=[];
  try{ r=detectCore(src); }catch(e){ console.error(e); }
  src.delete();
  r.sort((a,b)=>b.score-a.score);
  const diag=Math.hypot(t.width,t.height),outs=[];
  for(const c of r){
    const q=order(c.quad);
    if(outs.every(o=>o.reduce((s,p,i)=>s+Math.hypot(p[0]-q[i][0],p[1]-q[i][1]),0)/4>0.04*diag)) outs.push(q);
  }
  const res=outs.slice(0,4).map(q=>q.map(p=>[p[0]/sc,p[1]/sc]));
  const W=canvas.width,H=canvas.height,m=0.03;
  res.push([[W*m,H*m],[W*(1-m),H*m],[W*(1-m),H*(1-m)],[W*m,H*(1-m)]]);
  return res;
}
function detect(canvas){ return detectAll(canvas)[0]; }
/*DETECT_END*/

/* ---------- warp + filter ---------- */
/*ENHANCE_START*/
// divide by an estimate of the paper's lighting -> flat, evenly lit page
function flatten(rgb){
  const k=Math.min(1,240/Math.max(rgb.cols,rgb.rows));
  const sm=new cv.Mat(),bg=new cv.Mat(),full=new cv.Mat(),out=new cv.Mat();
  cv.resize(rgb,sm,new cv.Size(Math.max(8,Math.round(rgb.cols*k)),Math.max(8,Math.round(rgb.rows*k))),0,0,cv.INTER_AREA);
  const ke=cv.getStructuringElement(cv.MORPH_ELLIPSE,new cv.Size(9,9));
  cv.dilate(sm,bg,ke);
  cv.GaussianBlur(bg,bg,new cv.Size(21,21),0);
  cv.resize(bg,full,new cv.Size(rgb.cols,rgb.rows),0,0,cv.INTER_LINEAR);
  cv.divide(rgb,full,out,255,-1);
  sm.delete();bg.delete();full.delete();ke.delete();
  return out;
}
// gentle: only evens out uneven lighting / glare, keeps colours (for photos, covers, illustrations)
function evenLight(rgb){
  const k=Math.min(1,240/Math.max(rgb.cols,rgb.rows));
  const sw=Math.max(8,Math.round(rgb.cols*k)),sh=Math.max(8,Math.round(rgb.rows*k));
  const sm=new cv.Mat(),g=new cv.Mat(),bg=new cv.Mat(),full=new cv.Mat(),full3=new cv.Mat(),out=new cv.Mat();
  cv.resize(rgb,sm,new cv.Size(sw,sh),0,0,cv.INTER_AREA);
  cv.cvtColor(sm,g,cv.COLOR_RGB2GRAY);
  cv.GaussianBlur(g,bg,new cv.Size(0,0),Math.max(sw,sh)*0.07);
  const T=Math.max(60,cv.mean(bg)[0]);
  const lo=new cv.Mat(sh,sw,cv.CV_8UC1,new cv.Scalar(T/1.6)),hi=new cv.Mat(sh,sw,cv.CV_8UC1,new cv.Scalar(T/0.7));
  cv.max(bg,lo,bg); cv.min(bg,hi,bg);
  cv.resize(bg,full,new cv.Size(rgb.cols,rgb.rows),0,0,cv.INTER_LINEAR);
  cv.cvtColor(full,full3,cv.COLOR_GRAY2RGB);
  cv.divide(rgb,full3,out,T,-1);
  sm.delete();g.delete();bg.delete();full.delete();full3.delete();lo.delete();hi.delete();
  return out;
}
// dst: RGBA Mat, replaced in place with the enhanced page
function enhance(dst,filter){
  if(filter==='gray') filter='scangray';            // pages saved by the older version
  const rgb=new cv.Mat(); cv.cvtColor(dst,rgb,cv.COLOR_RGBA2RGB);
  if(filter==='even'){ const ev=evenLight(rgb); rgb.delete(); cv.cvtColor(ev,dst,cv.COLOR_RGB2RGBA); ev.delete(); return; }
  const flat=flatten(rgb); rgb.delete();
  const gray=new cv.Mat(); cv.cvtColor(flat,gray,cv.COLOR_RGB2GRAY);
  if(filter==='bw'){
    const tmp=new cv.Mat(), t=cv.threshold(gray,tmp,0,255,cv.THRESH_BINARY+cv.THRESH_OTSU); tmp.delete();
    cv.threshold(gray,gray,Math.min(Math.max(t,140),200),255,cv.THRESH_BINARY);
    cv.cvtColor(gray,dst,cv.COLOR_GRAY2RGBA);
  }else{
    // black point from the darkest 0.5% of pixels (capped), white point 250 -> clean white paper, dark crisp ink
    const d=gray.data,hist=new Array(256).fill(0); let n=0;
    for(let i=0;i<d.length;i+=7){hist[d[i]]++;n++;}
    let acc=0,b=0; for(let v=0;v<256;v++){acc+=hist[v]; if(acc>=n*0.005){b=v;break;}}
    b=Math.min(b,110);
    const lut=new Uint8Array(256);
    for(let v=0;v<256;v++){ const t=Math.max(0,Math.min(1,(v-b)/(250-b))); lut[v]=Math.round(255*Math.pow(t,1.25)); }
    const lm=cv.matFromArray(1,256,cv.CV_8U,Array.from(lut)), res=new cv.Mat();
    if(filter==='scangray'){ cv.LUT(gray,lm,res); cv.cvtColor(res,dst,cv.COLOR_GRAY2RGBA); }
    else{ cv.LUT(flat,lm,res); cv.cvtColor(res,dst,cv.COLOR_RGB2RGBA); }
    lm.delete();res.delete();
  }
  flat.delete();gray.delete();
}
/*ENHANCE_END*/


function warp(canvas,q,filter){
  const d=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  const w=Math.max(50,Math.round(Math.max(d(q[0],q[1]),d(q[3],q[2]))));
  const h=Math.max(50,Math.round(Math.max(d(q[0],q[3]),d(q[1],q[2]))));
  const src=cv.imread(canvas),dst=new cv.Mat();
  const a=cv.matFromArray(4,1,cv.CV_32FC2,q.flat());
  const b=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,w,0,w,h,0,h]);
  const M=cv.getPerspectiveTransform(a,b);
  cv.warpPerspective(src,dst,M,new cv.Size(w,h),cv.INTER_LINEAR,cv.BORDER_REPLICATE);
  if(filter!=='color') enhance(dst,filter);
  const out=document.createElement('canvas'); cv.imshow(out,dst);
  src.delete();dst.delete();a.delete();b.delete();M.delete();
  return out;
}

/* ---------- pages ---------- */
async function render(p){
  const c=await b2c(p.orig);
  const o=warp(c,p.corners,p.filter);
  p.w=o.width; p.h=o.height; p.out=await c2b(o,0.85);
  if(p.url)URL.revokeObjectURL(p.url); p.url=URL.createObjectURL(p.out);
}
async function addCanvas(c){
  await cvReady;
  const p={id:Date.now()+Math.random(),orig:await c2b(c,0.9),corners:detect(c),filter:'scan'};
  await render(p); pages.push(p); persist(); drawGrid();
}
function drawGrid(){
  const g=$('#grid'); g.innerHTML='';
  $('#pc').textContent=pages.length?`(${pages.length} หน้า)`:'';
  if(!pages.length){ g.innerHTML='<div id="empty">ยังไม่มีหน้า<br>กด “ถ่าย” เพื่อเริ่มสแกน<br>ถ่ายต่อเนื่องได้ไม่จำกัดจำนวนหน้า</div>'; return; }
  pages.forEach((p,i)=>{
    const d=document.createElement('div'); d.className='th';
    d.innerHTML=`<img src="${p.url}"><b>${i+1}</b>`; d.onclick=()=>openEdit(i); g.appendChild(d);
  });
}

/* ---------- camera ---------- */
async function openCam(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:3840},height:{ideal:2160}},audio:false});
  }catch(e){ alert('เปิดกล้องไม่ได้ ('+e.name+')\nอนุญาตกล้องให้ Safari แล้วลองใหม่ หรือใช้ปุ่ม “จากอัลบั้ม” แทน'); return; }
  $('#vid').srcObject=stream; shots=0; $('#cnt').textContent='0 หน้า'; show('cam');
}
function closeCam(){ if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;} show('home'); }
let queue=Promise.resolve();
$('#shutter').onclick=()=>{
  const v=$('#vid'); if(!v.videoWidth)return;
  const s=Math.min(1,MAXSIDE/Math.max(v.videoWidth,v.videoHeight));
  const c=document.createElement('canvas'); c.width=Math.round(v.videoWidth*s); c.height=Math.round(v.videoHeight*s);
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  shots++; $('#cnt').textContent=shots+' หน้า';
  queue=queue.then(()=>addCanvas(c));
};
$('#camDone').onclick=async()=>{ await queue; closeCam(); };

/* ---------- import ---------- */
$('#bImp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const fs=[...e.target.files]; e.target.value=''; if(!fs.length)return;
  for(let i=0;i<fs.length;i++){ busy(true,`กำลังประมวลผล ${i+1}/${fs.length}`); await addCanvas(await b2c(fs[i])); }
  busy(false);
};

/* ---------- editor ---------- */
async function openEdit(i){
  busy(true,'กำลังเปิด…');
  const p=pages[i], c=await b2c(p.orig);
  ed={idx:i,canvas:c,corners:p.corners.map(a=>[...a]),filter:p.filter==='gray'?'scangray':p.filter,f:1,drag:-1,cands:null,ci:-1,preview:false};
  $('#ePrev').textContent='👁 ดูผลลัพธ์';
  $('#eAuto').textContent='ตรวจขอบใหม่';
  show('edit'); busy(false); layoutEdit();
}
function layoutEdit(){
  const wrap=$('#editWrap'), cv2=$('#editCv'), c=ed.canvas;
  const f=Math.min((wrap.clientWidth-8)/c.width,(wrap.clientHeight-8)/c.height);
  ed.f=f; cv2.width=Math.round(c.width*f); cv2.height=Math.round(c.height*f);
  cv2.style.width=cv2.width+'px'; cv2.style.height=cv2.height+'px';
  $('#eTitle').textContent=`หน้า ${ed.idx+1}/${pages.length}`;
  document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('sel',b.dataset.f===ed.filter));
  drawEdit();
}
function drawEdit(){
  const cv2=$('#editCv');
  if(ed.preview){
    const o=warp(ed.canvas,ed.corners,ed.filter),wrap=$('#editWrap');
    const k=Math.min((wrap.clientWidth-8)/o.width,(wrap.clientHeight-8)/o.height);
    cv2.width=Math.round(o.width*k); cv2.height=Math.round(o.height*k);
    cv2.style.width=cv2.width+'px'; cv2.style.height=cv2.height+'px';
    cv2.getContext('2d').drawImage(o,0,0,cv2.width,cv2.height); return;
  }
  const x=cv2.getContext('2d'),f=ed.f;
  x.drawImage(ed.canvas,0,0,cv2.width,cv2.height);
  x.beginPath(); ed.corners.forEach((p,i)=>i?x.lineTo(p[0]*f,p[1]*f):x.moveTo(p[0]*f,p[1]*f)); x.closePath();
  x.fillStyle='rgba(10,132,255,.18)'; x.fill(); x.lineWidth=3; x.strokeStyle='#0a84ff'; x.stroke();
  ed.corners.forEach(p=>{ x.beginPath(); x.arc(p[0]*f,p[1]*f,15,0,7); x.fillStyle='#fff'; x.fill(); x.lineWidth=3; x.stroke(); });
}
const ptr=e=>{ const r=$('#editCv').getBoundingClientRect(); return [(e.clientX-r.left)/ed.f,(e.clientY-r.top)/ed.f]; };
$('#editCv').addEventListener('pointerdown',e=>{
  if(!ed||ed.preview)return; const [x,y]=ptr(e); let best=-1,bd=1e9;
  ed.corners.forEach((p,i)=>{ const d=Math.hypot(p[0]-x,p[1]-y)*ed.f; if(d<bd){bd=d;best=i;} });
  if(bd<60){ ed.drag=best; e.target.setPointerCapture(e.pointerId); }
});
$('#editCv').addEventListener('pointermove',e=>{
  if(!ed||ed.drag<0)return; const [x,y]=ptr(e);
  ed.corners[ed.drag]=[Math.max(0,Math.min(ed.canvas.width,x)),Math.max(0,Math.min(ed.canvas.height,y))]; drawEdit();
});
const endDrag=()=>{ if(ed)ed.drag=-1; };
$('#editCv').addEventListener('pointerup',endDrag); $('#editCv').addEventListener('pointercancel',endDrag);

document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{ ed.filter=b.dataset.f; layoutEdit(); });
$('#ePrev').onclick=()=>{
  ed.preview=!ed.preview;
  $('#ePrev').textContent=ed.preview?'✏️ กลับไปปรับขอบ':'👁 ดูผลลัพธ์';
  layoutEdit();
};
$('#eAuto').onclick=()=>{
  busy(true,'กำลังตรวจขอบ…');
  setTimeout(()=>{
    if(!ed.cands){ ed.cands=detectAll(ed.canvas); ed.ci=-1; }
    ed.ci=(ed.ci+1)%ed.cands.length;
    ed.corners=ed.cands[ed.ci].map(a=>[...a]);
    $('#eAuto').textContent=`ตรวจขอบ (${ed.ci+1}/${ed.cands.length}) กดลองแบบอื่น`;
    drawEdit(); busy(false);
  },30);
};
$('#eRot').onclick=()=>{
  const c=ed.canvas,H=c.height,n=document.createElement('canvas'); n.width=c.height; n.height=c.width;
  const x=n.getContext('2d'); x.translate(n.width,0); x.rotate(Math.PI/2); x.drawImage(c,0,0);
  ed.canvas=n; ed.corners=order(ed.corners.map(p=>[H-p[1],p[0]])); ed.rotated=true; ed.cands=null; $('#eAuto').textContent='ตรวจขอบใหม่'; layoutEdit();
};
$('#eBack').onclick=()=>{ ed=null; show('home'); };
$('#eSave').onclick=async()=>{
  busy(true,'กำลังบันทึก…'); const p=pages[ed.idx];
  if(ed.rotated) p.orig=await c2b(ed.canvas,0.9);
  p.corners=ed.corners; p.filter=ed.filter; await render(p);
  persist(); ed=null; drawGrid(); show('home'); busy(false);
};
$('#eDel').onclick=()=>{
  if(!confirm('ลบหน้านี้?'))return; pages.splice(ed.idx,1); ed=null; persist(); drawGrid(); show('home');
};
function move(d){
  const i=ed.idx,j=i+d; if(j<0||j>=pages.length)return;
  [pages[i],pages[j]]=[pages[j],pages[i]]; ed.idx=j; persist(); $('#eTitle').textContent=`หน้า ${j+1}/${pages.length}`;
}
$('#eL').onclick=()=>move(-1); $('#eR').onclick=()=>move(1);
$('#bCam').onclick=openCam;
$('#bClr').onclick=()=>{ if(pages.length&&confirm('ลบทุกหน้า?')){pages=[];persist();drawGrid();} };

/* ---------- PDF ---------- */
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});
$('#bPdf').onclick=async()=>{
  if(!pages.length){alert('ยังไม่มีหน้า');return;}
  busy(true,'กำลังสร้าง PDF…');
  try{
    const {jsPDF}=window.jspdf; let pdf=null;
    for(let i=0;i<pages.length;i++){
      const p=pages[i], H=210*p.h/p.w, o=H>=210?'p':'l';
      if(!pdf) pdf=new jsPDF({unit:'mm',format:[210,H],orientation:o,compress:true}); else pdf.addPage([210,H],o);
      pdf.addImage(await b2d(p.out),'JPEG',0,0,210,H,undefined,'FAST');
      busy(true,`กำลังสร้าง PDF ${i+1}/${pages.length}`);
    }
    const n=new Date(),z=v=>String(v).padStart(2,'0');
    const name=`scan-${n.getFullYear()}${z(n.getMonth()+1)}${z(n.getDate())}-${z(n.getHours())}${z(n.getMinutes())}.pdf`;
    const file=new File([pdf.output('blob')],name,{type:'application/pdf'});
    busy(false);
    if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:name}); return; }catch(e){ if(e.name==='AbortError')return; } }
    const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=name; a.click();
  }catch(e){ alert('สร้าง PDF ไม่สำเร็จ: '+e.message); }
  busy(false);
};

/* ---------- keep pages if Safari reloads the tab ---------- */
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('scanner',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
let saveT=null;
function persist(){
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{ try{
    const db=await idb(), data=pages.map(({id,orig,corners,filter,out,w,h})=>({id,orig,corners,filter,out,w,h}));
    db.transaction('kv','readwrite').objectStore('kv').put(data,'pages');
  }catch(e){} },400);
}
(async()=>{ try{
  const db=await idb();
  const data=await new Promise((res,rej)=>{ const r=db.transaction('kv').objectStore('kv').get('pages'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
  if(data&&data.length){ pages=data.map(p=>({...p,url:URL.createObjectURL(p.out)})); }
}catch(e){} drawGrid(); })();
</script>
</body>
</html>
